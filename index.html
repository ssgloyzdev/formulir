<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autopilot</title>

  <!-- Meta Tags untuk Preview -->
  <meta property="og:title" content="Autopilot">
  <meta property="og:description" content="Membuka konfigurasi Autopilot...">
  <meta property="og:url" content="https://ssgloyzdev.github.io/formulir">
  <meta property="og:type" content="website">
  
  <!-- Setup gambar dengan ukuran 800x300 -->
  <meta property="og:image" content="https://via.placeholder.com/800x300">
  <meta property="og:image:width" content="800">
  <meta property="og:image:height" content="300">

  <!-- 
    Karena menggunakan rasio lebar (800x300), twitter:card diubah menjadi "summary_large_image"
    agar gambar proporsional dan tidak di-crop paksa menjadi persegi oleh platform.
  -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Autopilot">
  <meta name="twitter:description" content="Membuka konfigurasi Autopilot...">
  <meta name="twitter:image" content="https://via.placeholder.com/800x300">

  <script>
    window.location.replace("http://localhost:3000");
  </script>
</head>
<body>
  <p>Membuka konfigurasi Autopilot...</p>
</body>
</html>
